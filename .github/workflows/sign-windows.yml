name: Build Windows App, Zip and Sign with Cosign (OIDC)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  build-sign-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: python -m PyInstaller PythonPackageDownloader.spec

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign PythonPackageDownloader.exe with OIDC
        run: cosign sign-blob --yes --output-signature dist/PythonPackageDownloader/PythonPackageDownloader.exe.sig dist/PythonPackageDownloader/PythonPackageDownloader.exe

      - name: Create ZIP from dist/PythonPackageDownloader
        run: Compress-Archive -Path dist/PythonPackageDownloader -DestinationPath PythonPackageDownloader-windows.zip

      - name: Sign ZIP with OIDC
        run: cosign sign-blob --yes --output-signature PythonPackageDownloader-windows.zip.sig PythonPackageDownloader-windows.zip

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PythonPackageDownloader-windows-zip
          path: PythonPackageDownloader-windows.zip

      - name: Upload ZIP signature
        uses: actions/upload-artifact@v4
        with:
          name: PythonPackageDownloader-windows-signature
          path: PythonPackageDownloader-windows.zip.sig

      - name: Extract version from pyproject.toml
        id: version
        run: |
          $content = Get-Content pyproject.toml -Raw
          $match = [regex]::Match($content, 'version\s*=\s*"(\d+\.\d+\.\d+)"')
          if ($match.Success) {
            $version = $match.Groups[1].Value
            echo "VERSION=$version" >> $env:GITHUB_OUTPUT
            echo "TAG=v$version" >> $env:GITHUB_OUTPUT
            echo "NAME=PythonPackageDownloader v$version (Windows ZIP)" >> $env:GITHUB_OUTPUT
          }

      - name: Publish Windows Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: ${{ steps.version.outputs.NAME }}
          draft: false
          prerelease: true
          overwrite_files: true
          files: |
            PythonPackageDownloader-windows.zip
            PythonPackageDownloader-windows.zip.sig
