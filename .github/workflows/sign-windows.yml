name: Build Windows App with Nuitka, Zip and Sign with Cosign (OIDC)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  build-sign-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies with uv
        run: uv sync --group build

      - name: Build with Nuitka (using Clang)
        run: |
          python -m uv run python -m nuitka `
            --onefile `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --windows-icon-from-ico="app_icon.ico" `
            --clang `
            --lto=auto `
            --output-filename="PythonPackageDownloader" `
            --include-data-dir="help=help" `
            --include-data-dir="locales=locales" `
            --include-data-files="config.json=config.json" `
            --include-data-files="loggingex_config.json=loggingex_config.json" `
            --include-data-files="pyproject.toml=pyproject.toml" `
            --include-data-files="Square44x44Logo.png=Square44x44Logo.png" `
            --include-data-files="Square150x150Logo.png=Square150x150Logo.png" `
            --output-dir="dist" `
            python_package_downloader.py

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign PythonPackageDownloader.exe with OIDC
        run: cosign sign-blob --yes --output-signature dist/PythonPackageDownloader.exe.sig dist/PythonPackageDownloader.exe

      - name: Create ZIP from dist/PythonPackageDownloader.exe
        run: Compress-Archive -Path dist/PythonPackageDownloader.exe -DestinationPath PythonPackageDownloader-windows.zip

      - name: Sign ZIP with OIDC
        run: cosign sign-blob --yes --output-signature PythonPackageDownloader-windows.zip.sig PythonPackageDownloader-windows.zip

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PythonPackageDownloader-windows-zip
          path: PythonPackageDownloader-windows.zip

      - name: Upload ZIP signature
        uses: actions/upload-artifact@v4
        with:
          name: PythonPackageDownloader-windows-signature
          path: PythonPackageDownloader-windows.zip.sig

      - name: Extract version from pyproject.toml
        id: version
        run: |
          $content = Get-Content pyproject.toml -Raw
          $match = [regex]::Match($content, 'version\s*=\s*"(\d+\.\d+\.\d+)"')
          if ($match.Success) {
            $version = $match.Groups[1].Value
            echo "VERSION=$version" >> $env:GITHUB_OUTPUT
            echo "TAG=v$version" >> $env:GITHUB_OUTPUT
            echo "NAME=PythonPackageDownloader v$version (Windows ZIP)" >> $env:GITHUB_OUTPUT
          }

      - name: Publish Windows Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: ${{ steps.version.outputs.NAME }}
          draft: false
          prerelease: true
          overwrite_files: true
          files: |
            PythonPackageDownloader-windows.zip
            PythonPackageDownloader-windows.zip.sig
