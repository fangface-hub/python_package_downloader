name: Build Linux App with Nuitka, Zip and Sign with Cosign (OIDC)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  build-sign-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev

      - name: Install uv
        run: pip install uv

      - name: Install dependencies with uv
        run: uv sync --group build

      - name: Build with Nuitka (using LLVM/Clang)
        run: |
          python -m uv run python -m nuitka \
            --onefile \
            --lto=auto \
            --include-data-dir="help=help" \
            --include-data-dir="locales=locales" \
            --include-data-files="config.json=config.json" \
            --include-data-files="loggingex_config.json=loggingex_config.json" \
            --include-data-files="pyproject.toml=pyproject.toml" \
            --include-data-files="Square44x44Logo.png=Square44x44Logo.png" \
            --include-data-files="Square150x150Logo.png=Square150x150Logo.png" \
            --output-dir="dist" \
            python_package_downloader.py

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign PythonPackageDownloader executable with OIDC
        run: cosign sign-blob --yes --output-signature dist/PythonPackageDownloader/PythonPackageDownloader.sig dist/PythonPackageDownloader/PythonPackageDownloader

      - name: Create ZIP from dist/PythonPackageDownloader
        run: |
          cd dist
          zip -r ../PythonPackageDownloader-linux.zip PythonPackageDownloader

      - name: Sign ZIP with OIDC
        run: cosign sign-blob --yes --output-signature PythonPackageDownloader-linux.zip.sig PythonPackageDownloader-linux.zip

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PythonPackageDownloader-linux-zip
          path: PythonPackageDownloader-linux.zip

      - name: Upload ZIP signature
        uses: actions/upload-artifact@v4
        with:
          name: PythonPackageDownloader-linux-signature
          path: PythonPackageDownloader-linux.zip.sig

      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' pyproject.toml | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Failed to extract version from pyproject.toml" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT
          echo "NAME=PythonPackageDownloader v$VERSION (Linux ZIP)" >> $GITHUB_OUTPUT

      - name: Publish Linux Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: ${{ steps.version.outputs.NAME }}
          draft: false
          prerelease: true
          overwrite_files: true
          files: |
            PythonPackageDownloader-linux.zip
            PythonPackageDownloader-linux.zip.sig
