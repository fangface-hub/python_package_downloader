# Nuitka compilation configuration
# このファイルは Nuitka に参照され、コンパイル設定を定義します

[build]
# 出力形式
onefile = true
follow-imports = true

# Windows GUI application settings
windows-console-mode = disable
windows-icon-from-ico = app_icon.ico

# Compiler backend - disable LTO for faster compilation
lto = no

# Output directory
output-dir = dist

[include-data-dirs]
help = help
locales = locales

[include-data-files]
config.json = config.json
loggingex_config.json = loggingex_config.json
pyproject.toml = pyproject.toml
Square44x44Logo.png = Square44x44Logo.png
Square150x150Logo.png = Square150x150Logo.png

[optimization]
# Assume frame objects not needed (faster, less debuggable)
assume-yes-for-downloads = true
